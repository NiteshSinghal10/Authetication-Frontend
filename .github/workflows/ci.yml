name: Auth Frontend Pipeline

on:
  push:
    branches:
      - staging

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Install dependencies
        run: npm ci 

      - name: Build production
        run: npm run build -- --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: ./dist

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ vars.SERVER_KEY }}
        run: |
          mkdir -p ~/key
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/key/mykey.pem
          chmod 600 ~/key/mykey.pem

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./dist

      - name: Run deployment over Cloudflare SSH
        run: |
          scp -r -i ~/key/mykey.pem -o StrictHostKeyChecking=no ./dist/* ec2-user@api.truewaysindia.com:/tmp/auth-frontend/

          ssh -i ~/key/mykey.pem -o StrictHostKeyChecking=no ec2-user@api.truewaysindia.com << 'EOF'

            echo "Current directory check:"
            pwd

            echo "Changing directory..."
            cd Desktop/vibely/frontend/Authetication-Frontend

            echo "Checking pwd:"
            pwd

            echo "Copy dist"
            cp -r /tmp/auth-frontend/* ./
          EOF
